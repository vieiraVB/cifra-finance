
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Cifra - Controle Financeiro</title>

    <!-- Identidade visual -->
    <meta name="theme-color" content="#0D0A16" />
    <meta name="description" content="Seu controle financeiro pessoal." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Ícone do navegador -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- Ícone da tela inicial do iPhone -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <!-- Modo aplicativo independente no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cifra" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0D0A16;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Você precisa habilitar JavaScript para executar o Cifra.</noscript>

    <div id="root"></div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
